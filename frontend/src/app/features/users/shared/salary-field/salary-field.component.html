<div [formGroup]="group" class="row">
  <label>Salário</label>
  <div class="grid-2">
    <input type="number" placeholder="0,00" formControlName="salary" />
    <select formControlName="currency">
      @for (c of currencies; track c) {
      <option [value]="c">{{ c }}</option>
      }
    </select>
  </div>
</div>
