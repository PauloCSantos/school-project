@if (open) {
<div class="modal-backdrop" (click)="close()"></div>
<div class="modal" role="dialog" aria-modal="true">
  <header class="modal__header">
    <h2>Cadastrar usuário</h2>
    <button class="icon" (click)="close()" aria-label="Fechar">✕</button>
  </header>

  <div class="modal__body">
    <label class="tipo">
      Tipo:&nbsp;
      <select [value]="tipo()" (change)="onTypeChange($event)">
        <option value="administrator">Administrador</option>
        <option value="teacher">Professor</option>
        <option value="student">Aluno</option>
        <option value="worker">Funcionário</option>
        <option value="master">Master</option>
      </select>
    </label>

    @switch (tipo()) { @case ('administrator') {
    <app-administrator-profile-wizard></app-administrator-profile-wizard>
    } @case ('teacher') {
    <app-teacher-profile-wizard></app-teacher-profile-wizard>
    } @case ('student') {
    <app-student-profile-wizard></app-student-profile-wizard>
    } @case ('worker') {
    <app-worker-profile-wizard></app-worker-profile-wizard>
    } @case ('master') {
    <app-master-profile-wizard></app-master-profile-wizard>
    } }
  </div>
</div>
}
