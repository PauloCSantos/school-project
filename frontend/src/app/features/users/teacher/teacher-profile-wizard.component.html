<h1>Cadastrar Teacher</h1>

<form [formGroup]="form" (ngSubmit)="submit()" novalidate class="form">
  <app-base-profile-form [form]="form"></app-base-profile-form>

  <fieldset class="grid">
    <legend>Professor</legend>
    <app-salary-field [group]="salaryGroup"></app-salary-field>

    <div class="row">
      <label>Graduação</label>
      <input
        type="text"
        formControlName="graduation"
        placeholder="ex: Licenciatura em Matemática"
      />
    </div>

    <div class="row">
      <label>Títulos acadêmicos</label>
      <input type="text" formControlName="academicDegrees" placeholder="ex: Mestrado, Doutorado" />
    </div>
  </fieldset>

  <div class="footer">
    <button type="submit" [disabled]="loading()">
      {{ loading() ? 'Salvando...' : 'Salvar' }}
    </button>
    @if (error()) {
    <p class="error">{{ error() }}</p>
    }
  </div>
</form>
